on: [push]

jobs:
  build:
    runs-on: build
    steps:
      - run: apk add --no-cache git coreutils

      - uses: actions/checkout@v3
        with:
          submodules: true

      - run: npm ci
      - run: npx quartz build

      - run: rm -rf /srv/notes/
      - run: cp -r public/ /srv/notes/
