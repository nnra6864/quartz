on:
  push:
  repository_dispatch:
    types: [vault-updated]

jobs:
  build:
    runs-on: build-alpine
    steps:
      - run: apk add --no-cache git coreutils rsync openssh-client

      - uses: actions/checkout@v3
        with:
          submodules: true

      - run: git submodule update --remote --merge

      - run: mkdir -p ~/.ssh
      - run: echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
      - run: chmod 600 ~/.ssh/id_deploy

      - run: npm ci
      - run: npx quartz build

      - run: rsync -av --inplace -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no -c aes128-gcm@openssh.com" public/ nn@host.containers.internal:.
